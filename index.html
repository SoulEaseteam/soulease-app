         2026-06-02 round), but /admin/* is heavily Thai, so Chrome's
         language-mismatch heuristic offers/auto-applies translation on
         top of already-Thai text. `notranslate` doesn't affect SEO or
         crawling (Google documents this) — it only tells the Translate
         feature to leave the page alone. Customers don't rely on this
         either; the site has its own real i18n system (5 languages). -->
