    <!-- Performance: เปิด connection ล่วงหน้าให้ origin ที่แอปคุยด้วยจริงๆ
         🆕 Round 28b30 (perf #66) — PageSpeed flagged 3 unused preconnects
         (googleapis, identitytoolkit, maps). Demoted to dns-prefetch so the
         browser still resolves DNS but doesn't waste a TLS handshake on
         origins that may never be hit during the first paint. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- 🔤 BRAND.md fonts: Inter (body) + Fraunces (serif headlines + italic
         <em> accent in brand red).
         🆕 Round 28b13 (perf) — fonts loaded ASYNC so they don't block FCP/LCP.
         Trick: `media="print"` makes the browser non-blocking; `onload`
         swaps to `all` once the stylesheet is ready. Noscript fallback
         keeps the site readable for the rare JS-disabled visitor.
         Weight subset trimmed to actually-used (was 5+5 weights → 3+2). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap"
      />
    </noscript>
