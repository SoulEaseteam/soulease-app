<?xml version="1.0" encoding="UTF-8"?>
<!--
  SunRed wordmark — large hero / social share size.
  Designed at 200px height. Use for: hero sections, share-card og:image,
  print headers, splash screens, favicon source.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 200"
     width="800"
     height="200"
     role="img"
     aria-label="SunRed">
  <!-- ─── Sun glyph ───────────────────────────────────────────────── -->
  <g transform="translate(0, 22)">
    <!-- Sun core -->
    <circle cx="78" cy="78" r="27.5" fill="#FE0944"/>
    <!-- 8 rays — proportional, rounded caps -->
    <g stroke="#FE7A52" stroke-width="13" stroke-linecap="round">
      <line x1="78" y1="17"  x2="78" y2="35"/>
      <line x1="78" y1="17"  x2="78" y2="35" transform="rotate(45  78 78)"/>
      <line x1="78" y1="17"  x2="78" y2="35" transform="rotate(90  78 78)"/>
      <line x1="78" y1="17"  x2="78" y2="35" transform="rotate(135 78 78)"/>
      <line x1="78" y1="17"  x2="78" y2="35" transform="rotate(180 78 78)"/>
      <line x1="78" y1="17"  x2="78" y2="35" transform="rotate(225 78 78)"/>
      <line x1="78" y1="17"  x2="78" y2="35" transform="rotate(270 78 78)"/>
      <line x1="78" y1="17"  x2="78" y2="35" transform="rotate(315 78 78)"/>
    </g>
  </g>

  <!-- ─── Wordmark "SunRed" ───────────────────────────────────────── -->
  <text x="208"
        y="148"
        fill="#2a1a14"
        font-family="'Fraunces', 'Times New Roman', serif"
        font-style="italic"
        font-weight="500"
        font-size="180"
        letter-spacing="-2.7"
        text-rendering="geometricPrecision">SunRed</text>
</svg>
