<?xml version="1.0" encoding="UTF-8"?>
<!--
  SunRed mark — sun glyph only (no wordmark).
  Use for: favicon, app icon, mobile bottom-nav, share avatar,
  loading spinner anchor, watermark.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     width="24"
     height="24"
     role="img"
     aria-label="SunRed mark">
  <!-- Sun core -->
  <circle cx="12" cy="12" r="4.2" fill="#FE0944"/>
  <!-- 8 rays — equal spacing, 45° apart -->
  <g stroke="#FE7A52" stroke-width="2" stroke-linecap="round">
    <line x1="12" y1="2.6" x2="12" y2="5.4"/>
    <line x1="12" y1="2.6" x2="12" y2="5.4" transform="rotate(45  12 12)"/>
    <line x1="12" y1="2.6" x2="12" y2="5.4" transform="rotate(90  12 12)"/>
    <line x1="12" y1="2.6" x2="12" y2="5.4" transform="rotate(135 12 12)"/>
    <line x1="12" y1="2.6" x2="12" y2="5.4" transform="rotate(180 12 12)"/>
    <line x1="12" y1="2.6" x2="12" y2="5.4" transform="rotate(225 12 12)"/>
    <line x1="12" y1="2.6" x2="12" y2="5.4" transform="rotate(270 12 12)"/>
    <line x1="12" y1="2.6" x2="12" y2="5.4" transform="rotate(315 12 12)"/>
  </g>
</svg>
